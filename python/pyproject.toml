[project]
name = "lethe-memory"
version = "0.1.0"
description = "Python client for lethe, an agent memory server that learns which memories to return."
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
langchain = ["langchain-core>=0.3"]
dev = ["pytest>=8", "langchain-core>=0.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lethe"]
